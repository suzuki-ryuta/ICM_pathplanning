<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#be123c"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1d4ed8"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .axis { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 5; }
      .baseline { stroke: #475569; stroke-width: 1.4; }
      .centerline { stroke: #334155; stroke-width: 1.2; stroke-dasharray: 4 5; }
      .left-link { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
      .right-link { fill: #ffe4e6; stroke: #be123c; stroke-width: 2; }
      .joint-left { fill: #1d4ed8; }
      .joint-right { fill: #be123c; }
      .text { fill: #0f172a; font-family: Arial, Helvetica, sans-serif; }
      .muted { fill: #475569; font-family: Arial, Helvetica, sans-serif; }
      .small { font-size: 13px; }
      .label { font-size: 15px; font-weight: 700; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 15px; }
      .dim-h { stroke: #1d4ed8; stroke-width: 1.8; marker-start: url(#arrow-blue); marker-end: url(#arrow-blue); }
      .dim-w { stroke: #be123c; stroke-width: 1.8; marker-start: url(#arrow-red); marker-end: url(#arrow-red); }
      .callout { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="980"/>

  <text class="text title" x="48" y="52">RobotConfig.ini [size] mapping</text>
  <text class="muted subtitle" x="48" y="78">Current zero-pose layout from config values. L* starts at bottom origin and R* starts at top origin.</text>

  <g id="world-frame">
    <line class="axis" x1="230" y1="880" x2="620" y2="880"/>
    <line class="axis" x1="450" y1="920" x2="450" y2="110"/>
    <text class="muted small" x="625" y="884">+x</text>
    <text class="muted small" x="458" y="116">+y</text>
    <line class="baseline" x1="235" y1="880" x2="620" y2="880"/>
    <line class="baseline" x1="235" y1="133" x2="620" y2="133"/>
    <text class="muted small" x="628" y="884">y=0</text>
    <text class="muted small" x="628" y="137">y=415</text>
  </g>

  <g id="left-hand">
    <text class="text label" x="272" y="138">Left hand: Lh/Lw</text>
    <text class="muted small" x="272" y="158">origin.l = (-30, 0), coord = identity</text>

    <rect class="left-link" x="342" y="809.8" width="108" height="70.2"/>
    <rect class="left-link" x="347.4" y="572.2" width="97.2" height="237.6"/>
    <rect class="left-link" x="347.4" y="338.2" width="97.2" height="234"/>
    <rect class="left-link" x="347.4" y="176.2" width="97.2" height="162"/>

    <line class="centerline" x1="396" y1="880" x2="396" y2="176.2"/>
    <circle class="joint-left" cx="396" cy="880" r="4.5"/>
    <circle class="joint-left" cx="396" cy="809.8" r="4.5"/>
    <circle class="joint-left" cx="396" cy="572.2" r="4.5"/>
    <circle class="joint-left" cx="396" cy="338.2" r="4.5"/>
    <circle class="joint-left" cx="396" cy="176.2" r="4.5"/>

    <text class="text label" x="364" y="849">L1</text>
    <text class="muted small" x="355" y="867">Lh1=39</text>
    <text class="muted small" x="354" y="790">Lw1=60</text>

    <text class="text label" x="365" y="693">L2</text>
    <text class="muted small" x="356" y="713">Lh2=132</text>
    <text class="muted small" x="355" y="591">Lw2=54</text>

    <text class="text label" x="365" y="459">L3</text>
    <text class="muted small" x="356" y="479">Lh3=130</text>
    <text class="muted small" x="355" y="357">Lw3=54</text>

    <text class="text label" x="365" y="253">L4</text>
    <text class="muted small" x="358" y="273">Lh4=90</text>
    <text class="muted small" x="355" y="195">Lw4=54</text>

    <text class="muted small" x="260" y="899">bottom/origin</text>
    <line class="dim-h" x1="326" y1="880" x2="326" y2="809.8"/>
    <text class="text small" x="278" y="849">h1</text>
    <line class="dim-w" x1="342" y1="898" x2="450" y2="898"/>
    <text class="text small" x="376" y="920">w1</text>
  </g>

  <g id="right-hand">
    <text class="text label" x="485" y="842">Right hand: Rh/Rw</text>
    <text class="muted small" x="485" y="862">origin.r = (30.01, 415), coord = -identity</text>

    <rect class="right-link" x="450.018" y="133" width="108" height="70.2"/>
    <rect class="right-link" x="455.418" y="203.2" width="97.2" height="237.6"/>
    <rect class="right-link" x="455.418" y="440.8" width="97.2" height="234"/>
    <rect class="right-link" x="455.418" y="674.8" width="97.2" height="162"/>

    <line class="centerline" x1="504.018" y1="133" x2="504.018" y2="836.8"/>
    <circle class="joint-right" cx="504.018" cy="133" r="4.5"/>
    <circle class="joint-right" cx="504.018" cy="203.2" r="4.5"/>
    <circle class="joint-right" cx="504.018" cy="440.8" r="4.5"/>
    <circle class="joint-right" cx="504.018" cy="674.8" r="4.5"/>
    <circle class="joint-right" cx="504.018" cy="836.8" r="4.5"/>

    <text class="text label" x="508" y="174">R1</text>
    <text class="muted small" x="496" y="194">Rh1=39</text>
    <text class="muted small" x="491" y="153">Rw1=60</text>

    <text class="text label" x="509" y="316">R2</text>
    <text class="muted small" x="497" y="336">Rh2=132</text>
    <text class="muted small" x="491" y="222">Rw2=54</text>

    <text class="text label" x="509" y="555">R3</text>
    <text class="muted small" x="497" y="575">Rh3=130</text>
    <text class="muted small" x="491" y="460">Rw3=54</text>

    <text class="text label" x="509" y="760">R4</text>
    <text class="muted small" x="499" y="780">Rh4=90</text>
    <text class="muted small" x="491" y="695">Rw4=54</text>

    <text class="muted small" x="562" y="125">top/origin</text>
    <line class="dim-h" x1="582" y1="133" x2="582" y2="203.2"/>
    <text class="text small" x="592" y="171">h1</text>
    <line class="dim-w" x1="450.018" y1="113" x2="558.018" y2="113"/>
    <text class="text small" x="493" y="104">w1</text>
  </g>

  <g id="link-definition">
    <rect class="callout" x="54" y="160" width="205" height="220" rx="8"/>
    <text class="text label" x="75" y="190">One link definition</text>
    <rect x="122" y="230" width="72" height="112" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <line class="centerline" x1="158" y1="342" x2="158" y2="230"/>
    <circle cx="158" cy="342" r="4.5" fill="#334155"/>
    <circle cx="158" cy="230" r="4.5" fill="#334155"/>
    <line class="dim-h" x1="210" y1="342" x2="210" y2="230"/>
    <line class="dim-w" x1="122" y1="360" x2="194" y2="360"/>
    <text class="text small" x="219" y="292">h</text>
    <text class="text small" x="149" y="378">w</text>
    <text class="muted small" x="75" y="404">h: joint-to-joint length</text>
    <text class="muted small" x="75" y="425">w: rectangle thickness</text>
  </g>

  <g id="notes">
    <rect class="callout" x="596" y="438" width="250" height="160" rx="8"/>
    <text class="text label" x="618" y="468">Numbering</text>
    <text class="muted small" x="618" y="495">1 is the base/fixed link.</text>
    <text class="muted small" x="618" y="518">2, 3, 4 continue toward</text>
    <text class="muted small" x="618" y="541">the fingertip side.</text>
    <text class="muted small" x="618" y="568">At runtime, links 2-4 rotate</text>
    <text class="muted small" x="618" y="591">with the joint angles.</text>
  </g>

  <g id="legend">
    <rect x="48" y="922" width="18" height="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text class="muted small" x="74" y="936">Lh/Lw values</text>
    <rect x="190" y="922" width="18" height="18" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/>
    <text class="muted small" x="216" y="936">Rh/Rw values</text>
    <line class="centerline" x1="337" y1="931" x2="388" y2="931"/>
    <text class="muted small" x="397" y="936">link centerline / joint chain</text>
  </g>
</svg>
